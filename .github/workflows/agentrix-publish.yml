name: Publish saved Agentrix reviews
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: agentrix-review-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'yuujay/last30days-skill'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - name: Publish completed results
        env:
          AGENTRIX_URL: ${{ vars.AGENTRIX_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: .github/scripts
        run: python3 agentrix.py publish
